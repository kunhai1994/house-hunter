# POI 类别字典 — 年轻租客视角
#
# 设计原则（v2，2026-05 优化）：
#   primary_keywords:  类别的代表性搜索词（"超市"、"购物中心"），用来调 API
#                      数量少（1-3 个），强 expected_tags 过滤，配额省 10x
#   brand_keywords:    具体品牌名清单，仅用于：
#                      (a) 用户指定 must_have_brand 时过滤
#                      (b) 在 POI name 里识别后标记 matched_brand 用于报告显示
#                      不调 API，不消耗配额
#   expected_tags:     百度/高德 POI 的 tag 或 type 必须含其中之一才算命中
#                      避免「山姆大叔少儿英语」这种 false positive

shopping:
  description: 购物与日常采买
  subcategories:
    big_supermarket:
      label: 大型超市
      primary_keywords: [超市]
      brand_keywords: [山姆, Costco, 沃尔玛, 永辉, "Ole'", "OLE", 华润万家, 盒马, 麦德龙, 家乐福]
      expected_tags: [超市, 仓储会员店, 大卖场, 量贩店]
      default_radius_m: 3000
    convenience_store:
      label: 便利店
      primary_keywords: [便利店]
      brand_keywords: [7-11, 全家, 罗森, 便利蜂, 美宜佳, 711, 7-Eleven]
      expected_tags: [便利店]
      default_radius_m: 500
    shopping_mall:
      label: 购物中心
      primary_keywords: [购物中心, 商场]
      brand_keywords: [万象城, 万达广场, 万象汇, 龙湖天街, 印象城, 来福士, 合生汇, SKP, 太古汇, 大悦城, 万象天地, 海岸城, 益田假日]
      expected_tags: [购物中心, 商场, 综合商场, 商城, 广场]
      default_radius_m: 3000

